<!doctype html><html><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#155eef"><link rel="manifest" href="manifest.webmanifest">
<title>Naveed Job Assistant</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#f4f6f8;color:#17202a}.wrap{max-width:700px;margin:auto;padding:18px}
.card{background:white;border-radius:18px;padding:18px;margin:12px 0;box-shadow:0 3px 15px #0001}h1{font-size:24px;margin:4px 0}
.sub,.small{color:#667085;font-size:14px}label{font-weight:bold;font-size:14px;display:block;margin:14px 0 7px}
input,textarea{width:100%;border:1px solid #d0d5dd;border-radius:12px;padding:12px;font-size:15px}textarea{min-height:180px}
button{border:0;border-radius:12px;padding:13px 16px;font-weight:bold;font-size:15px;margin:5px 0}.primary{background:#155eef;color:white;width:100%;margin-top:15px}
.secondary{background:#eef4ff;color:#155eef}.install{background:#17202a;color:white;width:100%}.score{font-size:30px;font-weight:800}.hidden{display:none}
</style></head><body><div class="wrap">
<div class="card"><h1>📱 Naveed Job Assistant</h1><div class="sub">Personal job application helper</div><button id="install" class="install hidden">📲 Install App</button></div>
<div class="card"><label>Job URL</label><input id="url" placeholder="Paste job link here">
<div class="small">If the page cannot be read, paste the job description below.</div>
<label>Job Description</label><textarea id="job" placeholder="Paste vacancy details here..."></textarea>
<button class="primary" onclick="analyse()">Analyse Job & Prepare Application</button></div>
<div id="out" class="card hidden"><div class="small">Estimated match</div><div id="score" class="score"></div><div id="matched" class="small"></div>
<hr><label>Job Title</label><div id="title"></div><label>Company</label><div id="company"></div>
<button class="secondary" onclick="download('Cover_Letter.txt',cover)">Download Cover Letter</button>
<button class="secondary" onclick="download('Email_Draft.txt',email)">Download Email</button>
<button class="secondary" onclick="navigator.clipboard.writeText(email);alert('Email copied')">Copy Email</button>
<button class="secondary" onclick="openGmail()">Open Gmail</button>
<p class="small">Review before sending. Applications are not submitted automatically.</p></div></div>
<script>
const P={"name": "Muhammad Naveed", "email": "mnaveed.career@gmail.com", "phone": "+92-344-5679379", "linkedin": "www.linkedin.com/in/naveed91", "skills": ["Branch & Banking Operations Management", "AML / KYC, Risk & Compliance", "Audit & Internal Controls", "Team Leadership & Performance Management", "Customer Service & Complaint Resolution", "Cash Management & Teller Operations", "Foreign Currency & Remittance Operations", "Digital Banking & Process Improvement", "Reporting, Administration & Financial Control", "Stakeholder Communication"]};let cover='',email='';
function title(t){let m=t.match(/(?:job title|position|role)\s*[:\-]\s*([^\n]+)/i);return m?m[1].trim():'Banking / Operations Position'}
function company(t){let m=t.match(/(?:company|employer|organisation|organization)\s*[:\-]\s*([A-Za-z0-9 &.,'-]{2,80})/i);return m?m[1].trim():'Hiring Company'}
function analyse(){let j=document.getElementById('job').value.trim();if(!j){alert('Please paste the job description.');return}
let t=title(j),c=company(j),l=j.toLowerCase(),m=P.skills.filter(s=>s.toLowerCase().split(/[\s\/,&-]+/).some(w=>w.length>3&&l.includes(w)));
let sc=Math.min(98,Math.max(55,60+m.length*5));document.getElementById('out').classList.remove('hidden');document.getElementById('score').textContent=sc+'%';document.getElementById('matched').textContent='Matched: '+(m.slice(0,7).join(', ')||'Banking operations, customer service');document.getElementById('title').textContent=t;document.getElementById('company').textContent=c;
cover=`Dear Hiring Manager,\n\nI am writing to apply for the ${t} position at ${c}. With over 11 years of banking experience across branch operations, compliance, customer service, risk management and team leadership, I believe my background is well suited to this opportunity.\n\nIn my current role as Operations Manager at Askari Bank, I manage branch operations, financial transactions, internal controls, customer service and regulatory requirements. Previously, I held Operations Manager roles at Al-Baraka Bank and Summit Bank, where I handled AML/KYC controls, foreign currency operations, audit readiness, staff supervision and process improvement.\n\nI would welcome the opportunity to discuss how my experience can contribute to your organisation.\n\nKind regards,\n${P.name}\n${P.phone}\n${P.email}`;
email=`Subject: Application for ${t} | ${P.name}\n\nDear Hiring Manager,\n\nPlease find attached my CV for the ${t} position at ${c}.\n\nI have over 11 years of banking experience, including Operations Manager roles covering branch operations, compliance, customer service, risk management and team leadership.\n\nI would appreciate the opportunity to be considered for this position.\n\nKind regards,\n${P.name}\n${P.phone}\n${P.email}`}
function download(n,t){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:'text/plain'}));a.download=n;a.click()}
function openGmail(){let s=encodeURIComponent(email.split('\n')[0].replace('Subject: ','')),b=encodeURIComponent(email.split('\n\n').slice(1).join('\n\n'));location.href='mailto:?subject='+s+'&body='+b}
let dp;addEventListener('beforeinstallprompt',e=>{e.preventDefault();dp=e;document.getElementById('install').classList.remove('hidden')});document.getElementById('install').onclick=()=>{if(dp){dp.prompt();dp=null}}
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');
</script></body></html>
